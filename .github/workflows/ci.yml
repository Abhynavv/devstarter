
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file" || exit 1
          done

